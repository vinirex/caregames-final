name: CI — CareGames+ API

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "backend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  # ── Unit tests (no DB required) ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (pkg packages)
        run: |
          go test ./pkg/... -v -count=1 -coverprofile=unit-coverage.out
          go tool cover -func=unit-coverage.out

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: backend/unit-coverage.out

  # ── Integration tests (needs PostgreSQL) ─────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       caregames_test
          POSTGRES_USER:     caregames
          POSTGRES_PASSWORD: caregames_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U caregames -d caregames_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          TEST_DB_HOST:     localhost
          TEST_DB_PORT:     5433
          TEST_DB_NAME:     caregames_test
          TEST_DB_USER:     caregames
          TEST_DB_PASSWORD: caregames_secret
        run: |
          go test ./tests/... -v -count=1 -timeout 120s -coverprofile=integration-coverage.out
          go tool cover -func=integration-coverage.out

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: backend/integration-coverage.out

  # ── Build Docker image ────────────────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t caregames-api:${{ github.sha }} .

      - name: Verify image starts
        run: |
          docker run --rm -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_NAME=caregames_db -e DB_USER=caregames \
            -e DB_PASSWORD=caregames_secret -e DB_SSL_MODE=disable \
            --entrypoint /bin/sh caregames-api:${{ github.sha }} \
            -c "ls /app/caregames-api && echo 'binary OK'"


services:
  postgres:
    image: postgres:16-alpine
    container_name: caregames_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       caregames_db
      POSTGRES_USER:     caregames
      POSTGRES_PASSWORD: caregames_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregames -d caregames_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregames_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:

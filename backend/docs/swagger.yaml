basePath: /
definitions:
  github_com_caregames_api_internal_models.Group:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      invite_code:
        type: string
      is_public:
        type: boolean
      max_members:
        type: integer
      name:
        type: string
      owner_id:
        type: string
      updated_at:
        type: string
    type: object
  github_com_caregames_api_internal_models.HealthSyncRecord:
    properties:
      calories:
        type: integer
      device_id:
        type: string
      distance_m:
        type: integer
      heart_rate_bpm:
        type: integer
      id:
        type: string
      platform:
        type: string
      raw_payload:
        description: JSONB as string
        type: string
      record_date:
        description: Use string if only YYYY-MM-DD
        type: string
      resting_hr_bpm:
        type: integer
      sleep_min:
        type: integer
      steps:
        type: integer
      synced_at:
        type: string
      temperature_c:
        type: number
      user_id:
        type: string
    type: object
  github_com_caregames_api_internal_models.SeasonCreate:
    properties:
      description:
        type: string
      ends_at:
        type: string
      name:
        type: string
      starts_at:
        type: string
    required:
    - ends_at
    - name
    - starts_at
    type: object
  github_com_caregames_api_internal_services.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_caregames_api_internal_services.RegisterInput:
    properties:
      age:
        minimum: 18
        type: integer
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - age
    - email
    - password
    type: object
  github_com_caregames_api_internal_services.UpdateProfileInput:
    properties:
      address:
        type: string
      birthday:
        description: '"YYYY-MM-DD"'
        type: string
      name:
        type: string
      theme_pref:
        description: '"dark" | "light"'
        type: string
    type: object
  github_com_caregames_api_pkg_response.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  github_com_caregames_api_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_caregames_api_pkg_response.APIError'
      message:
        type: string
      pagination:
        $ref: '#/definitions/github_com_caregames_api_pkg_response.Pagination'
      success:
        type: boolean
    type: object
  github_com_caregames_api_pkg_response.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_handlers.addPointsInput:
    properties:
      amount:
        minimum: 1
        type: integer
      reason:
        type: string
    required:
    - amount
    - reason
    type: object
  internal_handlers.spendPointsInput:
    properties:
      amount:
        minimum: 1
        type: integer
      reason:
        type: string
    required:
    - amount
    - reason
    type: object
